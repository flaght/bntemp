experiment_setups:
  # 回测与Live共用此文件，各入口只加载所选ID，不合并其他配置。
  m5_index_blend:
    description: "MO期权M5、IM期货M1，使用MA20与MA60均值作为指数信号"
    strategy_config: demos/08_option_vega/config/vega_backtest.json
    data_root: /workspace/data/temp_bomber1/ctp
    # 仅M5使用此目录；切换option_bar_minutes为1后读取data_root/kline/opt。
    opt_dir: temp/data/to/opt
    calendar_id: china.cffex
    option_bar_minutes: 5
    options_bar_timestamp: end
    execution_timing: next_market
    index_feature_file: demos/feature/index/index-blend.csv
    index_feature_config: demos/feature/index/index-blend.csv.dataset.json
    index_dataset: research.index.ma20_ma60.minute
    index_schema_version: 1
    index_value_field: index_blend
    option_product: MO
    future_product: IM
    index_code: "000852"
    start_day: "2026-08-13"
    end_day: "2026-09-30"
    frame_wait_seconds: 5
    bar_timestamp: end
    starting_balance: "40000000"
    log_level: INFO
    report_dir: demos/08_option_vega/results/backtest
    # 按部署填写官方到期结算资料；有到期残仓时必须提供对应资产的终值。
    option_settlements: null
    future_settlements: null
    settlement_available_time: "16:00"
    # 期权/期货日行情统一读取code、trade_date、settlePrice，无须配置列名。
    future_settlement_fee_per_contract: "0"
    no_tearsheet: true
    require_fills: true

  live_recording:
    description: "DolphinDB实时分钟行情与DFS指数，只记录策略目标"
    strategy_config: demos/08_option_vega/config/vega_live.json
    connect: true
    mode: recording
    # 常驻由交易日历选择日期；非null时只核对首个窗口。
    expected_trading_day: null
    simnow_environment: realtime
    calendar_id: china.cffex
    option_product: MO
    future_product: IM
    index_code: "000852"
    market_config: demos/08_option_vega/config/market_dolphindb.json
    index_source: dolphindb-dfs
    # Live沿用已接入的原始指数Bar投影，不使用回测的MA快照文件。
    index_feature_config: demos/08_option_vega/feature/index.json
    index_dataset: index.minute
    index_schema_version: 1
    index_poll_seconds: 1
    reference_source: dolphindb
    frame_wait_seconds: 20
    run_forever: true
    hours_code: MO
    trading_hours_database: dfs://bomber_static
    trading_hours_table: fut_trading_session
    no_session_overrides: true
    # 仅--no-run-forever定时模式使用seconds。
    seconds: 900
    log_level: INFO
    report_dir: demos/08_option_vega/results/live

  live_model:
    description: "DolphinDB实时分钟行情，参考价模型执行"
    strategy_config: demos/08_option_vega/config/vega_live.json
    connect: true
    mode: model
    expected_trading_day: null
    simnow_environment: realtime
    calendar_id: china.cffex
    option_product: MO
    future_product: IM
    index_code: "000852"
    market_config: demos/08_option_vega/config/market_dolphindb.json
    index_source: dolphindb-dfs
    index_feature_config: demos/08_option_vega/feature/index.json
    index_dataset: index.minute
    index_schema_version: 1
    index_poll_seconds: 1
    reference_source: dolphindb
    frame_wait_seconds: 20
    run_forever: true
    hours_code: MO
    trading_hours_database: dfs://bomber_static
    trading_hours_table: fut_trading_session
    no_session_overrides: true
    # 仅--no-run-forever定时模式使用seconds。
    seconds: 900
    # 按部署填写本模式的检查点；恢复时还须设置resume: true。
    state_file: null
    resume: false
    log_level: INFO
    report_dir: demos/08_option_vega/results/live

  live_simnow:
    description: "DolphinDB实时分钟行情，CTP SimNow执行"
    strategy_config: demos/08_option_vega/config/vega_live.json
    connect: true
    mode: simnow
    expected_trading_day: null
    simnow_environment: realtime
    calendar_id: china.cffex
    option_product: MO
    future_product: IM
    index_code: "000852"
    market_config: demos/08_option_vega/config/market_dolphindb.json
    index_source: dolphindb-dfs
    index_feature_config: demos/08_option_vega/feature/index.json
    index_dataset: index.minute
    index_schema_version: 1
    index_poll_seconds: 1
    reference_source: dolphindb
    frame_wait_seconds: 20
    run_forever: true
    hours_code: MO
    trading_hours_database: dfs://bomber_static
    trading_hours_table: fut_trading_session
    no_session_overrides: true
    # 仅--no-run-forever定时模式使用seconds。
    seconds: 900
    enable_orders: true
    confirm_simnow: true
    # 填写与run_live会话身份匹配的检查点，不能直接替换共享账户检查点。
    state_file: null
    resume: false
    max_session_orders: 20
    query_timeout: 30
    log_level: INFO
    report_dir: demos/08_option_vega/results/live
