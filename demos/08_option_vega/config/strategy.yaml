experiment_setups:
  # 回测与Live共用此文件，各入口只加载所选ID，不合并其他配置。
  m5_index_blend:
    description: "MO期权M5、IM期货M1，使用MA20与MA60均值作为指数信号"
    data_root: /workspace/data/temp_bomber1/ctp
    # 仅M5使用此目录；切换option_bar_minutes为1后读取data_root/kline/opt。
    opt_dir: temp/data/to/opt
    calendar_id: china.cffex
    option_bar_minutes: 5
    options_bar_timestamp: end
    option_slot: "14:00"
    execution_timing: next_market
    index_feature_file: demos/feature/index/index-blend.csv
    index_feature_config: demos/feature/index/index-blend.csv.dataset.json
    index_dataset: research.index.ma20_ma60.minute
    index_schema_version: 1
    index_value_field: index_blend
    option_product: MO
    future_product: IM
    index_code: "000852"
    start_day: "2026-08-13"
    end_day: "2026-09-30"
    frame_wait_seconds: 5
    bar_timestamp: end
    starting_balance: "40000000"
    log_level: INFO
    report_dir: tests/results/backtest/option-vega-m5-index-blend
    no_tearsheet: true
    require_fills: true

  live_recording:
    description: "DolphinDB实时分钟行情与DFS指数，只记录策略目标"
    connect: true
    mode: recording
    # 每次启动须改为实际会话交易日，也可用--expected-trading-day覆盖。
    expected_trading_day: "20261106"
    simnow_environment: realtime
    calendar_id: china.cffex
    option_product: MO
    future_product: IM
    index_code: "000852"
    market_source: dolphindb
    market_bar_table: stream_cffex_1min
    market_bar_timestamp: end
    market_volume_mode: cumulative
    market_bar_max_age_seconds: 120
    index_source: dolphindb-dfs
    # Live沿用已接入的原始指数Bar投影，不使用回测的MA快照文件。
    index_feature_config: demos/08_option_vega/feature/index.json
    index_dataset: index.minute
    index_schema_version: 1
    index_poll_seconds: 1
    reference_source: dolphindb
    option_slot: "14:00"
    frame_wait_seconds: 20
    seconds: 900
    log_level: INFO
    report_dir: tests/results/live-option-vega/recording

  live_model:
    description: "DolphinDB实时分钟行情，参考价模型执行"
    connect: true
    mode: model
    expected_trading_day: "20261106"
    simnow_environment: realtime
    calendar_id: china.cffex
    option_product: MO
    future_product: IM
    index_code: "000852"
    market_source: dolphindb
    market_bar_table: stream_cffex_1min
    market_bar_timestamp: end
    market_volume_mode: cumulative
    market_bar_max_age_seconds: 120
    index_source: dolphindb-dfs
    index_feature_config: demos/08_option_vega/feature/index.json
    index_dataset: index.minute
    index_schema_version: 1
    index_poll_seconds: 1
    reference_source: dolphindb
    option_slot: "14:00"
    frame_wait_seconds: 20
    seconds: 900
    # 按部署填写本模式的检查点；恢复时还须设置resume: true。
    state_file: null
    resume: false
    log_level: INFO
    report_dir: tests/results/live-option-vega/model

  live_simnow:
    description: "DolphinDB实时分钟行情，CTP SimNow执行"
    connect: true
    mode: simnow
    expected_trading_day: "20261106"
    simnow_environment: realtime
    calendar_id: china.cffex
    option_product: MO
    future_product: IM
    index_code: "000852"
    market_source: dolphindb
    market_bar_table: stream_cffex_1min
    market_bar_timestamp: end
    market_volume_mode: cumulative
    market_bar_max_age_seconds: 120
    index_source: dolphindb-dfs
    index_feature_config: demos/08_option_vega/feature/index.json
    index_dataset: index.minute
    index_schema_version: 1
    index_poll_seconds: 1
    reference_source: dolphindb
    option_slot: "14:00"
    frame_wait_seconds: 20
    seconds: 900
    enable_orders: true
    confirm_simnow: true
    # 填写与run_live会话身份匹配的检查点，不能直接替换共享账户检查点。
    state_file: null
    resume: false
    max_session_orders: 20
    query_timeout: 30
    log_level: INFO
    report_dir: tests/results/live-option-vega/simnow
